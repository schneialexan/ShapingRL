[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shaping-rl"
version = "0.1.0"
description = "ShapingRL - Reward Shaping and Potential-Based Methods in Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name = "Björn Brauer" },
    { name = "Leandro Gregorini" },
    { name = "Alexandru Schneider" },
    { name = "Flavio Kluser" },
    { name = "Roman Zberg" }
]
keywords = ["reinforcement-learning", "reward-shaping", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "torch>=2.0.0",
    "gymnasium[accept-rom-license,atari,box2d]>=0.29.0",
    "ale-py>=0.8.0",
    "pygame>=2.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "wandb>=0.16.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "stable-baselines3[extra]>=2.7.0",
    "moviepy>=2.2.1",
]

[project.optional-dependencies]
# GPU support - install with: pip install -e ".[cuda]" or pip install -e ".[rocm]"
cuda = [
    "torch>=2.0.0",  # Will use CUDA version when installed via PyTorch index
]
rocm = [
    "torch>=2.0.0",  # Will use ROCm version when installed via PyTorch index
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/btwbrauer/ShapingRL"
Documentation = "https://github.com/btwbrauer/ShapingRL/blob/main/README.md"
Repository = "https://github.com/btwbrauer/ShapingRL"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
